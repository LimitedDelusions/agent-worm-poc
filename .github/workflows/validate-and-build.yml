name: Validate and Build Agent Worm POC
on:
  workflow_dispatch:
concurrency:
  group: agent-worm-poc-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE_VERSION: 0.8.6
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" PyYAML==6.0.2
      - name: Normalize script permissions
        run: chmod +x scripts/runpod/*.sh
      - name: Compile and test
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src scripts tests
          pytest -q
      - name: Validate shell, JSON, and workflow YAML
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          shellcheck scripts/runpod/*.sh
          python - <<'PYCODE'
          import json
          from pathlib import Path
          import yaml
          for path in Path('configs').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          yaml.safe_load(Path('.github/workflows/validate-and-build.yml').read_text(encoding='utf-8'))
          print('JSON and YAML parsed successfully')
          PYCODE
      - name: Verify source integrity and release audit
        env:
          PYTHONPATH: src
        run: |
          python scripts/release/generate_integrity.py --check
          sha256sum -c SOURCE_HASHES.sha256
          python scripts/validate_release.py
      - name: Run complete simulated gated validation
        env:
          PYTHONPATH: src
        run: |
          rm -rf outputs/ci-fake-validation
          python scripts/run_gated.py fake-gated --root . --output-root outputs/ci-fake-validation
          python - <<'PYCODE'
          import json
          from pathlib import Path
          statuses=list(Path('outputs/ci-fake-validation').glob('*/RUN_STATUS.json'))
          assert len(statuses)==1,statuses
          value=json.loads(statuses[0].read_text())
          assert value['status']=='completed',value
          assert value['gates']['compatibility']['passed'],value
          assert value['gates']['positive_pair']['passed'],value
          assert value['gates']['shakedown']['passed'],value
          print(json.dumps(value,indent=2))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: agent-worm-poc-validation
          path: |
            RELEASE_MANIFEST.json
            SOURCE_HASHES.sha256
            outputs/ci-fake-validation
          if-no-files-found: error
          retention-days: 30
  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af --volumes || true
          df -h
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Compute image metadata
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SOURCE_REPO=https://github.com/${{ github.repository }}
            GIT_REVISION=${{ github.sha }}
            BUILD_TIMESTAMP=${{ steps.image.outputs.created }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.IMAGE_VERSION }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
      - name: Write immutable RunPod image reference
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p dist
          printf '%s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST" > dist/RUNPOD_IMAGE.txt
          cat dist/RUNPOD_IMAGE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-worm-poc-container-reference
          path: dist/RUNPOD_IMAGE.txt
          if-no-files-found: error
          retention-days: 90
